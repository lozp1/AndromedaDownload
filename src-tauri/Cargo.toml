[package]
name = "andromeda_download"
version = "1.0.0"
description = "Andromeda Download - High Speed Multi-socket Engine"
authors = ["Franco Paolo López Gálvez <francopaolo_lg@outlook.com>"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "andromeda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
md-5 = "0.10"
rfd = "0.17.2"
