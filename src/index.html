<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Andromeda Download</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/img/icono_app.ico">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('andromeda_theme');
        if (!savedTheme) {
          var raw = localStorage.getItem('andromeda_settings');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.tema) {
              var t = parsed.tema.toLowerCase();
              if (t === 'white' || t === 'light') savedTheme = 'white';
              else if (t === 'contrast' || t === 'alto-contraste') savedTheme = 'contrast';
              else if (t === 'oled' || t === 'black') savedTheme = 'oled';
              else if (t === 'system' || t === 'auto') savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'white';
              else savedTheme = 'dark';
            }
          }
        }
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
